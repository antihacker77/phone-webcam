name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-android-apk.yml"]

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild -p android

      # Release, not debug: a debug build doesn't embed the JS bundle and
      # tries to load it from a Metro dev server on a PC, so on its own it
      # never gets past a red error screen. Expo's prebuilt release config
      # signs with the debug keystore, so the APK still installs directly.
      - name: Build (release, signed with the debug keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found. Build outputs:"
            find android/app/build/outputs
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" phone-webcam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/phone-webcam.apk
