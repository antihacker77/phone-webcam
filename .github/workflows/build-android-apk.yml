name: Build unsigned Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-android-apk.yml"]

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild -p android

      - name: Build (debug, auto-signed with the debug keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found. Build outputs:"
            find android/app/build/outputs
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" phone-webcam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/phone-webcam.apk
