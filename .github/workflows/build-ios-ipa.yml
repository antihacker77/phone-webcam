name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**"]

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild -p ios

      - name: Force-disable code signing for all Pods targets
        run: |
          cat >> ios/Podfile <<'RUBY'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
              end
            end
          end
          RUBY
          cd ios && pod install

      - name: Detect Xcode scheme
        id: scheme
        run: |
          cd ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" ! -name "Pods.xcodeproj" | head -1)
          echo "Using project: $PROJECT"
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{flag=1;next}flag' | head -1 | xargs)
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Build products:"
            find ios/build/Build/Products
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: mobile/app-unsigned.ipa
