# coturn config — fill in the placeholders below before first run.
# Docs: https://github.com/coturn/coturn/wiki/turnserver

listening-port=3478
min-port=49160
max-port=49200

# Long-term credential mechanism with a single static user.
lt-cred-mech
user=phonecam:CHANGE_ME_TURN_PASSWORD
realm=CHANGE_ME_TURN_DOMAIN

# Set this to the VPS's public IPv4 address so relay candidates advertise the
# reachable address instead of a docker-internal one.
external-ip=CHANGE_ME_PUBLIC_IP

fingerprint
no-multicast-peers
no-cli
stale-nonce=600
total-quota=100
